project:
  type: book
  output-dir: _book

book:
  title: "From Data to Impact"
  subtitle: "A Structured Path from Python Fundamentals to Production-Ready Data Science"
  author: "Anthony Faustine"
  date: today
  site-url: "https://sambaiga.github.io/ds-mlops-path/"
  repo-url: "https://github.com/sambaiga/ds-mlops-path"
  repo-branch: main
  repo-actions: [edit, issue, source]
  search: true
  page-navigation: true
  bread-crumbs: false

  sidebar:
    collapse-level: 1

  navbar:
    right:
      - icon: envelope-at
        href: "mailto:sambaiga@gmail.com"
        aria-label: "Email Anthony Faustine"
      - icon: linkedin
        href: "https://www.linkedin.com/in/sambaiga"
        aria-label: "LinkedIn"
      - icon: github
        href: https://github.com/sambaiga/ds-mlops-path
        aria-label: "View source on GitHub"

  page-footer:
    left: |
      <span class="faux-block">&copy; 2025&ndash;2026 <a href="https://sambaiga.github.io/">Anthony Faustine</a></span>
      <span class="faux-block">Code licensed under <a href="https://www.apache.org/licenses/LICENSE-2.0">Apache 2.0</a></span>
    center: |
      <div class="footer-social">
        <a href="mailto:sambaiga@gmail.com" title="Email"><i class="bi bi-envelope-at-fill"></i></a>
        <a href="https://github.com/sambaiga" title="GitHub"><i class="bi bi-github"></i></a>
        <a href="https://www.linkedin.com/in/sambaiga" title="LinkedIn"><i class="bi bi-linkedin"></i></a>
      </div>
    right: |
      <span class="faux-block">Made with <a href="https://quarto.org">Quarto</a></span>
      <span class="faux-block"><a href="https://github.com/sambaiga/ds-mlops-path"><i class="bi bi-github"></i> View source</a></span>

  chapters:
    - index.qmd
    - preface.qmd
    - about.qmd
    - tutorials/00-landscape.qmd
    - part: "Python foundations"
      chapters:
        - tutorials/01-python-basics/01-python-core.ipynb
        - tutorials/01-python-basics/02-control-flow.ipynb
        - tutorials/01-python-basics/03-functions.ipynb
        - tutorials/01-python-basics/04-classes.ipynb
        - tutorials/01-python-basics/05-math-statistics.ipynb
        - tutorials/01-python-basics/06-numpy.ipynb
        - tutorials/01-python-basics/07-numpy-advanced.ipynb
    - part: "Data analysis"
      chapters:
        - tutorials/01-python-basics/08-pandas-core.ipynb
        - tutorials/01-python-basics/09-pandas-operations.ipynb
        - tutorials/01-python-basics/10-combining-reshaping.ipynb
        - tutorials/01-python-basics/11-time-series.ipynb
        - tutorials/01-python-basics/12-polars.ipynb
        - tutorials/01-python-basics/13-great-tables.ipynb
    - part: "Data visualization"
      chapters:
        - tutorials/01-python-basics/14-matplotlib.ipynb
        - tutorials/01-python-basics/15-lets-plot.ipynb
        - tutorials/01-python-basics/16-data-storytelling.ipynb
        - tutorials/01-python-basics/17-storytelling-capstone.ipynb

    - part: "Dev tools"
      chapters:
        - tutorials/02-dev-tools/18-vscode-setup.qmd
        - tutorials/02-dev-tools/19-uv-project-setup.qmd
        - tutorials/02-dev-tools/20-code-quality-ruff.qmd
        - tutorials/02-dev-tools/21-type-annotations.ipynb
        - tutorials/02-dev-tools/22-git-github.qmd
        - tutorials/02-dev-tools/23-pytest-testing.qmd
        - tutorials/02-dev-tools/24-pre-commit-automation.qmd
        - tutorials/02-dev-tools/25-pydantic-validation.ipynb
        - tutorials/02-dev-tools/26-pandera-schema-validation.ipynb
        - tutorials/02-dev-tools/27-logging.ipynb

  # Later parts are added chapter by chapter as each reaches the same standard as the first three.
    - part: "ML landscape"
      chapters:
        - tutorials/04-ml-intro/28-ml-introduction.qmd
        - tutorials/04-ml-intro/29-ml-what-is-ml.qmd
        - tutorials/04-ml-intro/30-ml-workflow.qmd
        - tutorials/04-ml-intro/31-sklearn-core.ipynb
        - tutorials/04-ml-intro/32-sklearn-pipeline.ipynb
    - part: "Classical ML projects"
      chapters:
        - tutorials/05-classical-ml-projects/33-spend-regression.ipynb
    - part: "Deep learning"
      chapters: []
    - part: "LLMs"
      chapters: []
    - part: "MLOps"
      chapters: []
    - part: "Production monitoring"
      chapters: []
    - part: "ML system design"
      chapters: []
    - part: "Value-driven AI"
      chapters: []

icons:
  bootstrap: true

format:
  html:
    theme: [cosmo, tutorials/_quarto/brand.scss]
    highlight-style: github
    code-fold: false
    code-copy: true
    code-link: false
    toc: true
    toc-depth: 3
    toc-title: "In this chapter"
    number-sections: false
    fig-cap-location: bottom
    anchor-sections: true
    smooth-scroll: true

freeze: auto
jupyter: python3
execute:
  enabled: true
  error: true
  warning: false
  cache: false
