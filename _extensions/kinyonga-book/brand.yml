# kinyonga brand: the single source of every colour, font and logo in the kit.
# Quarto >= 1.6 reads this file natively (Typst, HTML, reveal.js). `kinyonga sync` turns it into the token files
# that LaTeX, SCSS and CSS need and copies it into every extension; `kinyonga check` fails if any copy differs.
meta:
  name:
    full: kinyonga
    short: kinyonga

logo:
  images:
    kinyonga-mark:
      path: assets/mark.svg
      alt: kinyonga
    kinyonga-logo:
      path: assets/logo.svg
      alt: kinyonga
    kinyonga-logo-dark:
      path: assets/logo-dark.svg
      alt: kinyonga
  small: kinyonga-mark
  medium:
    light: kinyonga-logo
    dark: kinyonga-logo-dark

color:
  palette:
    white: "#FFFFFF"
    ink: "#1E293B"
    ink-2: "#334155"
    slate: "#64748B"
    slate-light: "#94A3B8"
    rule: "#E2E8F0"
    panel: "#F8FAFC"
    blue: "#0369A1"
    blue-deep: "#0C4A6E"
    blue-soft: "#E8F2F8"
    orange: "#E26029"
    orange-ink: "#A94A1E"
    orange-soft: "#FBEBE4"
    success: "#059669"
    danger: "#DC2626"
    # Site accents and tints of the umeme web book (its brand.scss), kept as named tokens so no theme file writes a hex.
    sky-bright: "#38BDF8"
    ink-deep: "#0F172A"
    tint-slate: "#F1F5F9"
    tint-line: "#EEF2F7"
    tint-blue: "#EAF3FA"
    tint-gray: "#E9ECEF"
    slate-pale: "#CBD5E1"
    gray-light: "#9CA3AF"
    violet-deep: "#7C3AED"
    slate-dark: "#475569"
    emerald: "#10B981"
    salmon: "#FF777C"
    amber-light: "#FBBF24"
    tint-sky: "#F0F7FF"
    rose-deep: "#E11D48"
    amber-deep: "#D97706"
    violet-light: "#A78BFA"
    violet: "#8B5CF6"
    sky-light: "#7DD3FC"
    tint-amber: "#FFF8E1"
    salmon-light: "#FFA0A4"
    tint-red: "#FEF2F2"
    rose-light: "#FB7185"
    tint-gray-2: "#F9FAFB"
    tint-violet: "#F5F3FF"
    tint-blue-2: "#EFF6FF"
    tint-green: "#EBF5F0"
    tint-green-2: "#EAF7F0"
    gray-rule: "#E5E7EB"
    blue-pale: "#DBEAFE"
    violet-pale: "#C4B5FD"
    red-deep: "#991B1B"
    violet-ink: "#5B21B6"
    emerald-light: "#34D399"
    teal: "#2DD4BF"
    navy: "#1E3A5F"
    foreground-deep: "#1A202C"
    ink-night: "#0B1220"
    green-ink: "#065F46"
    blue-mid: "#025D8E"
    green-cb: "#009E73"
    night-green: "#0F2A1E"
    night-green-2: "#10291F"
    night-blue: "#16243D"
    night-violet: "#241B3D"
    night-blue-rule: "#2C4A6E"
    night-red: "#3A1414"
    night-amber: "#3A2E0A"
    blue-ice: "#BFDBFE"
    red-light: "#F87171"
  foreground: ink
  background: white
  primary: blue
  secondary: slate
  success: success
  info: blue
  warning: orange
  danger: danger
  light: panel
  dark: ink
  link: blue

typography:
  fonts:
    - family: Jost
      source: file
      files:
        - path: fonts/Jost-Regular.ttf
          weight: 400
          style: normal
        - path: fonts/Jost-SemiBold.ttf
          weight: 600
          style: normal
        - path: fonts/Jost-Bold.ttf
          weight: 700
          style: normal
    - family: Libre Franklin
      source: file
      files:
        - path: fonts/LibreFranklin-Regular.ttf
          weight: 400
          style: normal
        - path: fonts/LibreFranklin-Medium.ttf
          weight: 500
          style: normal
        - path: fonts/LibreFranklin-Italic.ttf
          weight: 400
          style: italic
        - path: fonts/LibreFranklin-SemiBold.ttf
          weight: 600
          style: normal
        - path: fonts/LibreFranklin-SemiBoldItalic.ttf
          weight: 600
          style: italic
    - family: JetBrains Mono
      source: file
      files:
        - path: fonts/JetBrainsMono-Regular.ttf
          weight: 400
          style: normal
        - path: fonts/JetBrainsMono-Bold.ttf
          weight: 700
          style: normal
  base:
    family: Libre Franklin
    weight: 400
  headings:
    family: Jost
    weight: 600
  monospace:
    family: JetBrains Mono
    weight: 400
