# The print edition: only the parts that are complete, without the web landing page. Render with
#   QUARTO_PYTHON=.venv/bin/python uv run quarto render --profile print --to kinyonga-book-pdf
# The notebooks are executed with the `ark` kernel (the environment of this project), so register it first:
#   uv run python -m ipykernel install --user --name ark
project:
  output-dir: _print

book:
  chapters:
    - preface.qmd
    - about.qmd
    - tutorials/00-landscape.qmd
    - part: "Python foundations"
      chapters:
        - tutorials/01-python-basics/01-python-core.ipynb
        - tutorials/01-python-basics/02-control-flow.ipynb
        - tutorials/01-python-basics/03-functions.ipynb
        - tutorials/01-python-basics/04-classes.ipynb
        - tutorials/01-python-basics/05-math-statistics.ipynb
        - tutorials/01-python-basics/06-numpy.ipynb
        - tutorials/01-python-basics/07-numpy-advanced.ipynb
    - part: "Data analysis"
      chapters:
        - tutorials/01-python-basics/08-pandas-core.ipynb
        - tutorials/01-python-basics/09-pandas-operations.ipynb
        - tutorials/01-python-basics/10-combining-reshaping.ipynb
        - tutorials/01-python-basics/11-time-series.ipynb
        - tutorials/01-python-basics/12-polars.ipynb
        - tutorials/01-python-basics/13-great-tables.ipynb
    - part: "Data visualization"
      chapters:
        - tutorials/01-python-basics/14-matplotlib.ipynb
        - tutorials/01-python-basics/15-lets-plot.ipynb
        - tutorials/01-python-basics/16-data-storytelling.ipynb
        - tutorials/01-python-basics/17-storytelling-capstone.ipynb
    - part: "Dev tools"
      chapters:
        - tutorials/02-dev-tools/18-vscode-setup.qmd
        - tutorials/02-dev-tools/19-uv-project-setup.qmd
        - tutorials/02-dev-tools/20-code-quality-ruff.qmd
        - tutorials/02-dev-tools/21-type-annotations.ipynb
        - tutorials/02-dev-tools/22-git-github.qmd
        - tutorials/02-dev-tools/23-pytest-testing.qmd
        - tutorials/02-dev-tools/24-pre-commit-automation.qmd
        - tutorials/02-dev-tools/25-pydantic-validation.ipynb
        - tutorials/02-dev-tools/26-pandera-schema-validation.ipynb
        - tutorials/02-dev-tools/27-logging.ipynb

  # Later parts are added chapter by chapter as each reaches the same standard as the first three.
    - part: "ML landscape"
      chapters:
        - tutorials/04-ml-intro/28-ml-introduction.qmd
        - tutorials/04-ml-intro/29-ml-what-is-ml.qmd
        - tutorials/04-ml-intro/30-ml-workflow.qmd
        - tutorials/04-ml-intro/31-sklearn-core.ipynb
        - tutorials/04-ml-intro/32-sklearn-pipeline.ipynb
    - part: "Classical ML projects"
      chapters:
        - tutorials/05-classical-ml-projects/33-spend-regression.ipynb

format:
  kinyonga-book-pdf:
    filters:
      - path: tutorials/_quarto/print.lua
        at: pre-quarto
    header-includes:
      - \renewcommand{\bookweb}{sambaiga.github.io/ds-mlops-path}
      - \renewcommand{\booktitle}{From Data to Impact}
