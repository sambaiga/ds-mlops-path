<svg width="900" height="270" viewBox="0 0 900 270" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: 'Jost', system-ui, sans-serif; }
      .code { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
      .label { font-size: 12px; fill: #374151; font-weight: 600; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M1,1 L6,3.5 L1,6 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="270" rx="12" fill="#F8FAFC"/>

  <!-- Code line box -->
  <rect x="20" y="84" width="860" height="52" rx="8" fill="#1E293B"/>

  <!--
    Code: def weighted_grade(midterm: float, score: float = 0.0) -> float:
    At 17px JetBrains Mono, char advance ≈ 10.2px. Base x = 34.
    Segment start positions (char index × 10.2 + 34):
      def           chars 0–2    x=34
      weighted_grade chars 4–17  x=34+4×10.2=74.8≈75
      (             char 18      x=34+18×10.2=217.6≈218  (separator)
      midterm: float, chars 19–33 x=34+19×10.2=227.8≈228
      (space)       char 34      x=34+34×10.2=381       (separator)
      score: float = 0.0 chars 35–53 x=34+35×10.2=391.2≈392
      )             char 54      x=34+54×10.2=584.8≈585  (separator)
      -> float      chars 55–63  x=34+55×10.2=595≈596
      :             char 64      x=34+64×10.2=686.8≈688  (separator)
  -->

  <!-- Highlighted spans (4px inset on each side) -->
  <!-- def: chars 0–2 = 30.6px span -->
  <rect x="32"  y="88" width="40"  height="40" rx="4" fill="#7C3AED" opacity="0.7"/>
  <!-- weighted_grade: 14 chars = 142.8px span -->
  <rect x="73"  y="88" width="152" height="40" rx="4" fill="#0369A1" opacity="0.7"/>
  <!-- midterm: float,: 15 chars = 153px span -->
  <rect x="226" y="88" width="160" height="40" rx="4" fill="#059669" opacity="0.7"/>
  <!-- score: float = 0.0: 19 chars = 193.8px span -->
  <rect x="390" y="88" width="202" height="40" rx="4" fill="#D97706" opacity="0.6"/>
  <!-- -> float: 9 chars = 91.8px span (chars 56–64 with leading space) -->
  <rect x="594" y="88" width="96"  height="40" rx="4" fill="#0891B2" opacity="0.7"/>

  <!-- Code text -->
  <text x="34"  y="117" class="code" font-size="17" fill="#F1F5F9">def</text>
  <text x="75"  y="117" class="code" font-size="17" fill="#F1F5F9">weighted_grade</text>
  <text x="218" y="117" class="code" font-size="17" fill="#CBD5E1">(</text>
  <text x="228" y="117" class="code" font-size="17" fill="#F1F5F9">midterm: float,</text>
  <text x="392" y="117" class="code" font-size="17" fill="#F1F5F9">score: float = 0.0</text>
  <text x="585" y="117" class="code" font-size="17" fill="#CBD5E1">)</text>
  <text x="596" y="117" class="code" font-size="17" fill="#F1F5F9">-&gt; float</text>
  <text x="688" y="117" class="code" font-size="17" fill="#CBD5E1">:</text>

  <!-- Connector lines -->
  <!-- def up -->
  <line x1="52"  y1="88"  x2="52"  y2="44"  stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr)"/>
  <!-- function name up -->
  <line x1="149" y1="88"  x2="149" y2="44"  stroke="#0369A1" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr)"/>
  <!-- param down -->
  <line x1="306" y1="136" x2="306" y2="178" stroke="#059669" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr)"/>
  <!-- default down -->
  <line x1="491" y1="136" x2="491" y2="178" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr)"/>
  <!-- return up -->
  <line x1="642" y1="88"  x2="642" y2="44"  stroke="#0891B2" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr)"/>

  <!-- Labels top row -->
  <rect x="14"  y="20" width="78"  height="22" rx="4" fill="#7C3AED" opacity="0.15"/>
  <text x="53"  y="35" class="label" fill="#7C3AED" text-anchor="middle">keyword</text>

  <rect x="96" y="20" width="108" height="22" rx="4" fill="#0369A1" opacity="0.15"/>
  <text x="150" y="35" class="label" fill="#0369A1" text-anchor="middle">function name</text>

  <rect x="586" y="20" width="110" height="22" rx="4" fill="#0891B2" opacity="0.15"/>
  <text x="641" y="35" class="label" fill="#0891B2" text-anchor="middle">return type</text>

  <!-- Labels bottom row — spaced with ≥30px gap -->
  <rect x="228" y="184" width="155" height="22" rx="4" fill="#059669" opacity="0.15"/>
  <text x="306" y="199" class="label" fill="#059669" text-anchor="middle">parameter + type hint</text>

  <rect x="413" y="184" width="155" height="22" rx="4" fill="#D97706" opacity="0.15"/>
  <text x="491" y="199" class="label" fill="#B45309" text-anchor="middle">parameter + default</text>

  <!-- Caption -->
  <text x="450" y="248" font-size="13" fill="#64748B" text-anchor="middle">
    Every part of a function signature is optional except <tspan font-family="monospace" fill="#374151">def</tspan>, the name, and the colon.
  </text>
</svg>
