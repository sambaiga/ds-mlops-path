<svg width="820" height="360" viewBox="0 0 820 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: 'Jost', system-ui, sans-serif; }
    </style>
    <filter id="shadow" x="-4%" y="-3%" width="110%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(30,41,59,0.09)"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L1,7 L7,4 Z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="410" y="22" text-anchor="middle"
        font-size="13" font-weight="700" fill="#1E293B">A class bundles data and the functions that operate on it</text>
  <line x1="40" y1="30" x2="780" y2="30" stroke="#E2E8F0" stroke-width="1"/>

  <!-- CLASS BOX (left column) -->
  <!-- Header -->
  <rect x="40" y="44" width="360" height="34" rx="8 8 0 0" fill="#0369A1"/>
  <text x="220" y="63" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">class StudentRecord:</text>

  <!-- Body -->
  <rect x="40" y="78" width="360" height="240" rx="0 0 8 8" fill="#EFF6FF" stroke="#0369A1" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- __init__ row -->
  <rect x="52" y="90" width="8" height="40" rx="2" fill="#0369A1"/>
  <text x="70" y="107" font-size="10.5" font-weight="600" fill="#0C4A6E">__init__(self, name, scores, course)</text>
  <text x="70" y="122" font-size="9.5" fill="#475569">Stores incoming data on self. Runs once at</text>
  <text x="70" y="134" font-size="9.5" fill="#475569">construction: StudentRecord("Alice", [88, 92], ...)</text>

  <!-- divider -->
  <line x1="52" y1="140" x2="388" y2="140" stroke="#BFDBFE" stroke-width="1"/>

  <!-- @property row -->
  <rect x="52" y="148" width="8" height="40" rx="2" fill="#7C3AED"/>
  <text x="70" y="165" font-size="10.5" font-weight="600" fill="#3B0764">@property  average_score</text>
  <text x="70" y="180" font-size="9.5" fill="#475569">Computes a derived value on demand.</text>
  <text x="70" y="192" font-size="9.5" fill="#475569">Access like an attribute: record.average_score</text>

  <!-- divider -->
  <line x1="52" y1="198" x2="388" y2="198" stroke="#BFDBFE" stroke-width="1"/>

  <!-- @classmethod row -->
  <rect x="52" y="206" width="8" height="40" rx="2" fill="#059669"/>
  <text x="70" y="223" font-size="10.5" font-weight="600" fill="#065F46">@classmethod  from_csv_row(cls, row)</text>
  <text x="70" y="238" font-size="9.5" fill="#475569">Builds an instance from a raw dict. Receives</text>
  <text x="70" y="250" font-size="9.5" fill="#475569">the class itself, not self: StudentRecord.from_csv_row(row)</text>

  <!-- divider -->
  <line x1="52" y1="256" x2="388" y2="256" stroke="#BFDBFE" stroke-width="1"/>

  <!-- __repr__ row -->
  <rect x="52" y="264" width="8" height="40" rx="2" fill="#D97706"/>
  <text x="70" y="281" font-size="10.5" font-weight="600" fill="#92400E">__repr__(self)</text>
  <text x="70" y="296" font-size="9.5" fill="#475569">Controls print output and debugger display.</text>
  <text x="70" y="308" font-size="9.5" fill="#475569">Returns a human-readable string for the object.</text>

  <!-- Arrow: class → instance -->
  <line x1="402" y1="160" x2="448" y2="160" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="424" y="153" text-anchor="middle" font-size="9" fill="#64748B">instantiate</text>

  <!-- INSTANCE BOX (right column) -->
  <!-- Header -->
  <rect x="450" y="44" width="330" height="34" rx="8 8 0 0" fill="#059669"/>
  <text x="615" y="63" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">alice = StudentRecord(...)</text>

  <!-- Body -->
  <rect x="450" y="78" width="330" height="155" rx="0 0 8 8" fill="#F0FDF4" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>

  <text x="466" y="104" font-size="10.5" font-weight="600" fill="#065F46">alice.name</text>
  <text x="466" y="118" font-size="9.5" fill="#475569">"Alice Kamau"</text>
  <line x1="466" y1="126" x2="768" y2="126" stroke="#BBF7D0" stroke-width="1"/>

  <text x="466" y="145" font-size="10.5" font-weight="600" fill="#065F46">alice.scores</text>
  <text x="466" y="159" font-size="9.5" fill="#475569">[88.0, 92.0, 85.0]</text>
  <line x1="466" y1="167" x2="768" y2="167" stroke="#BBF7D0" stroke-width="1"/>

  <text x="466" y="186" font-size="10.5" font-weight="600" fill="#3B0764">alice.average_score</text>
  <text x="466" y="200" font-size="9.5" fill="#475569">88.33  (computed, not stored)</text>
  <line x1="466" y1="208" x2="768" y2="208" stroke="#BBF7D0" stroke-width="1"/>

  <text x="466" y="225" font-size="10.5" font-weight="600" fill="#065F46">repr(alice)</text>
  <text x="466" y="240" font-size="9.5" fill="#475569">StudentRecord(Alice Kamau | 88.33)</text>

  <!-- Legend -->
  <rect x="450" y="248" width="330" height="70" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="466" y="264" font-size="9" font-weight="600" fill="#475569" letter-spacing="0.5">METHOD TYPES</text>
  <rect x="466" y="271" width="8" height="8" rx="2" fill="#0369A1"/>
  <text x="480" y="280" font-size="9" fill="#1E293B">__init__  — stores data</text>
  <rect x="466" y="285" width="8" height="8" rx="2" fill="#7C3AED"/>
  <text x="480" y="294" font-size="9" fill="#1E293B">@property  — computes on access</text>
  <rect x="466" y="299" width="8" height="8" rx="2" fill="#059669"/>
  <text x="480" y="308" font-size="9" fill="#1E293B">@classmethod  — factory, receives cls</text>
  <rect x="466" y="313" width="8" height="8" rx="2" fill="#D97706"/>
  <text x="480" y="322" font-size="9" fill="#1E293B">__repr__  — controls display</text>

  <!-- Section label bottom -->
  <text x="410" y="348" text-anchor="middle" font-size="10" fill="#94A3B8">One class definition; every instance shares the methods and owns its own data</text>
</svg>
