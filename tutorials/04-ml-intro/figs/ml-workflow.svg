<svg width="800" height="270" viewBox="0 0 800 270" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Jost:wght@400;600;700&amp;display=swap');
    </style>
    <filter id="card-shadow" x="-6%" y="-8%" width="114%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(30,41,59,0.10)"/>
    </filter>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#94A3B8"/>
    </marker>
    <marker id="arr-back" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#CBD5E1"/>
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="400" y="22" text-anchor="middle"
        font-family="'Jost','Segoe UI',system-ui,sans-serif"
        font-size="14" font-weight="700" fill="#1E293B">The End-to-End ML Workflow</text>
  <text x="400" y="37" text-anchor="middle"
        font-family="'Libre Franklin','Segoe UI',sans-serif"
        font-size="10.5" fill="#64748B">Nine stages from problem framing to monitoring, with two key feedback loops</text>
  <line x1="40" y1="44" x2="760" y2="44" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ========================================================
       ROW 1: Problem Framing | Data Collection | EDA | Feature Engineering | Model Selection
       Stage box: w=132, h=64, top=54, bottom=118, gap=14
       x positions: 10, 156, 302, 448, 594
       3-line content baselines (top+22, top+38, top+54); 2-line (top+26, top+46)
       ======================================================== -->

  <!-- Stage 1: Problem Framing (dark) -->
  <rect x="10" y="54" width="132" height="64" rx="8" fill="#1E293B" filter="url(#card-shadow)"/>
  <text x="76" y="76" text-anchor="middle"
        font-family="'Jost',sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">Problem</text>
  <text x="76" y="92" text-anchor="middle"
        font-family="'Jost',sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">Framing</text>
  <text x="76" y="108" text-anchor="middle"
        font-family="'Libre Franklin',sans-serif" font-size="8.5" fill="#94A3B8">spec card</text>

  <!-- arrow 1 to 2 -->
  <line x1="142" y1="86" x2="154" y2="86" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Stage 2: Data Collection (green) -->
  <rect x="156" y="54" width="132" height="64" rx="8" fill="#EBF5F0" stroke="#059669" stroke-width="1.2" filter="url(#card-shadow)"/>
  <text x="222" y="76" text-anchor="middle"
        font-family="'Jost',sans-serif" font-size="10.5" font-weight="700" fill="#065F46">Data</text>
  <text x="222" y="92" text-anchor="middle"
        font-family="'Jost',sans-serif" font-size="10.5" font-weight="700" fill="#065F46">Collection</text>
  <text x="222" y="108" text-anchor="middle"
        font-family="'Libre Franklin',sans-serif" font-size="8.5" fill="#059669">gather + clean</text>

  <!-- arrow 2 to 3 -->
  <line x1="288" y1="86" x2="300" y2="86" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Stage 3: EDA (green, 2-line) -->
  <rect x="302" y="54" width="132" height="64" rx="8" fill="#EBF5F0" stroke="#059669" stroke-width="1.2" filter="url(#card-shadow)"/>
  <text x="368" y="80" text-anchor="middle"
        font-family="'Jost',sans-serif" font-size="10.5" font-weight="700" fill="#065F46">EDA</text>
  <text x="368" y="100" text-anchor="middle"
        font-family="'Libre Franklin',sans-serif" font-size="8.5" fill="#059669">explore + understand</text>

  <!-- arrow 3 to 4 -->
  <line x1="434" y1="86" x2="446" y2="86" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Stage 4: Feature Engineering (green) -->
  <rect x="448" y="54" width="132" height="64" rx="8" fill="#EBF5F0" stroke="#059669" stroke-width="1.2" filter="url(#card-shadow)"/>
  <text x="514" y="76" text-anchor="middle"
        font-family="'Jost',sans-serif" font-size="10.5" font-weight="700" fill="#065F46">Feature</text>
  <text x="514" y="92" text-anchor="middle"
        font-family="'Jost',sans-serif" font-size="10.5" font-weight="700" fill="#065F46">Engineering</text>
  <text x="514" y="108" text-anchor="middle"
        font-family="'Libre Franklin',sans-serif" font-size="8.5" fill="#059669">transform + enrich</text>

  <!-- arrow 4 to 5 -->
  <line x1="580" y1="86" x2="592" y2="86" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Stage 5: Model Selection (blue) -->
  <rect x="594" y="54" width="132" height="64" rx="8" fill="#EAF3FA" stroke="#0369A1" stroke-width="1.2" filter="url(#card-shadow)"/>
  <text x="660" y="76" text-anchor="middle"
        font-family="'Jost',sans-serif" font-size="10.5" font-weight="700" fill="#1E3A5F">Model</text>
  <text x="660" y="92" text-anchor="middle"
        font-family="'Jost',sans-serif" font-size="10.5" font-weight="700" fill="#1E3A5F">Selection</text>
  <text x="660" y="108" text-anchor="middle"
        font-family="'Libre Franklin',sans-serif" font-size="8.5" fill="#0369A1">choose algorithm</text>

  <!-- Down arrow from Model Selection's bottom edge (not its caption text) to Training -->
  <line x1="660" y1="118" x2="660" y2="158" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- ========================================================
       ROW 2: Training | Evaluation | Deployment | Monitoring
       Same x-columns as row 1 (594, 448, 302, 156), flow continues right to left.
       top=162, bottom=226, all boxes are 2-line (title + caption)
       ======================================================== -->

  <!-- Stage 6: Training (blue), directly below Model Selection -->
  <rect x="594" y="162" width="132" height="64" rx="8" fill="#EAF3FA" stroke="#0369A1" stroke-width="1.2" filter="url(#card-shadow)"/>
  <text x="660" y="188" text-anchor="middle"
        font-family="'Jost',sans-serif" font-size="10.5" font-weight="700" fill="#1E3A5F">Training</text>
  <text x="660" y="208" text-anchor="middle"
        font-family="'Libre Franklin',sans-serif" font-size="8.5" fill="#0369A1">learn from data</text>

  <!-- arrow Training to Evaluation (flow continues leftward) -->
  <line x1="594" y1="194" x2="582" y2="194" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Stage 7: Evaluation (amber), directly below Feature Engineering -->
  <rect x="448" y="162" width="132" height="64" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2" filter="url(#card-shadow)"/>
  <text x="514" y="188" text-anchor="middle"
        font-family="'Jost',sans-serif" font-size="10.5" font-weight="700" fill="#92400E">Evaluation</text>
  <text x="514" y="208" text-anchor="middle"
        font-family="'Libre Franklin',sans-serif" font-size="8.5" fill="#F59E0B">test set + metrics</text>

  <!-- arrow Evaluation to Deployment -->
  <line x1="448" y1="194" x2="436" y2="194" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Stage 8: Deployment (purple), directly below EDA -->
  <rect x="302" y="162" width="132" height="64" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2" filter="url(#card-shadow)"/>
  <text x="368" y="188" text-anchor="middle"
        font-family="'Jost',sans-serif" font-size="10.5" font-weight="700" fill="#4C1D95">Deployment</text>
  <text x="368" y="208" text-anchor="middle"
        font-family="'Libre Franklin',sans-serif" font-size="8.5" fill="#7C3AED">serve predictions</text>

  <!-- arrow Deployment to Monitoring -->
  <line x1="302" y1="194" x2="290" y2="194" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Stage 9: Monitoring (purple), directly below Data Collection -->
  <rect x="156" y="162" width="132" height="64" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2" filter="url(#card-shadow)"/>
  <text x="222" y="188" text-anchor="middle"
        font-family="'Jost',sans-serif" font-size="10.5" font-weight="700" fill="#4C1D95">Monitoring</text>
  <text x="222" y="208" text-anchor="middle"
        font-family="'Libre Franklin',sans-serif" font-size="8.5" fill="#7C3AED">track in production</text>

  <!-- ========================================================
       FEEDBACK LOOP 1: Evaluation back to Feature Engineering
       Evaluation and Feature Engineering share the same column (x=448-580),
       so this is a single straight vertical segment in the row gap, not a detour.
       ======================================================== -->
  <line x1="514" y1="162" x2="514" y2="118" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-back)"/>
  <text x="524" y="143" text-anchor="start"
        font-family="'Libre Franklin',sans-serif" font-size="7.5" fill="#F59E0B" font-style="italic">iterate on features</text>

  <!-- ========================================================
       FEEDBACK LOOP 2: Monitoring back to Problem Framing
       Monitoring (col x=156) and Problem Framing (col x=10) are not column-aligned,
       so this jogs once, entirely within the row gap band, well clear of both rows.
       ======================================================== -->
  <path d="M222,162 L222,140 L76,140 L76,118" fill="none"
        stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-back)"/>
  <text x="149" y="135" text-anchor="middle"
        font-family="'Libre Franklin',sans-serif" font-size="7.5" fill="#64748B" font-style="italic">refine the problem</text>

  <!-- ========================================================
       LEGEND / COLOUR KEY
       ======================================================== -->
  <line x1="10" y1="240" x2="790" y2="240" stroke="#E2E8F0" stroke-width="1"/>

  <circle cx="240" cy="250" r="5" fill="#1E293B"/>
  <text x="250" y="254" font-family="'Libre Franklin',sans-serif" font-size="8.5" fill="#64748B">Framing</text>

  <circle cx="310" cy="250" r="5" fill="#059669"/>
  <text x="320" y="254" font-family="'Libre Franklin',sans-serif" font-size="8.5" fill="#64748B">Data preparation</text>

  <circle cx="410" cy="250" r="5" fill="#0369A1"/>
  <text x="420" y="254" font-family="'Libre Franklin',sans-serif" font-size="8.5" fill="#64748B">Modelling</text>

  <circle cx="480" cy="250" r="5" fill="#F59E0B"/>
  <text x="490" y="254" font-family="'Libre Franklin',sans-serif" font-size="8.5" fill="#64748B">Evaluation</text>

  <circle cx="548" cy="250" r="5" fill="#7C3AED"/>
  <text x="558" y="254" font-family="'Libre Franklin',sans-serif" font-size="8.5" fill="#64748B">Production</text>

</svg>
