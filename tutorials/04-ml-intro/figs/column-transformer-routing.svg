<svg width="760" height="330" viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Jost:wght@400;600;700&amp;display=swap');
    </style>
    <filter id="card-shadow" x="-6%" y="-8%" width="114%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(30,41,59,0.10)"/>
    </filter>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="380" y="24" text-anchor="middle"
        font-family="'Jost','Segoe UI',system-ui,sans-serif"
        font-size="14" font-weight="700" fill="#1E293B">One Preprocessor, Two Routes</text>
  <text x="380" y="40" text-anchor="middle"
        font-family="'Libre Franklin','Segoe UI',sans-serif"
        font-size="10.5" fill="#64748B">ColumnTransformer sends each column down the treatment it needs, then rejoins them</text>
  <line x1="40" y1="47" x2="720" y2="47" stroke="#E2E8F0" stroke-width="1"/>

  <!-- INPUT -->
  <rect x="40" y="70" width="150" height="46" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" filter="url(#card-shadow)"/>
  <text x="115" y="89" text-anchor="middle" font-family="'Jost',sans-serif" font-size="10" font-weight="700" fill="#334155">14 raw columns</text>
  <text x="115" y="103" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="8.5" fill="#64748B">X_train</text>

  <!-- NUMERIC BRANCH -->
  <path d="M190,88 L215,88 L215,105 L245,105" fill="none" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="248" y="80" width="150" height="50" rx="6" fill="#EBF5F0" stroke="#059669" stroke-width="1.2" filter="url(#card-shadow)"/>
  <text x="323" y="98" text-anchor="middle" font-family="'Jost',sans-serif" font-size="9.5" font-weight="700" fill="#065F46">num: 8 columns</text>
  <text x="323" y="112" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="8" fill="#065F46">SimpleImputer</text>
  <text x="323" y="123" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="8" fill="#065F46">StandardScaler</text>

  <path d="M398,105 L448,105" fill="none" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="423" y="98" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="8" font-style="italic" fill="#94A3B8">8 out</text>

  <!-- CATEGORICAL BRANCH -->
  <path d="M190,98 L215,98 L215,185 L245,185" fill="none" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="248" y="160" width="150" height="50" rx="6" fill="#EAF3FA" stroke="#0369A1" stroke-width="1.2" filter="url(#card-shadow)"/>
  <text x="323" y="178" text-anchor="middle" font-family="'Jost',sans-serif" font-size="9.5" font-weight="700" fill="#1E3A5F">cat: 6 columns</text>
  <text x="323" y="192" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="8" fill="#1E3A5F">SimpleImputer</text>
  <text x="323" y="203" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="8" fill="#1E3A5F">OneHotEncoder</text>

  <path d="M398,185 L448,185" fill="none" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="423" y="178" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="8" font-style="italic" fill="#94A3B8">27 out</text>

  <!-- MERGE -->
  <path d="M450,105 L470,105 L470,145 L500,145" fill="none" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M450,185 L470,185 L470,145" fill="none" stroke="#94A3B8" stroke-width="1.4"/>

  <rect x="503" y="95" width="215" height="100" rx="8" fill="#1E293B" filter="url(#card-shadow)"/>
  <text x="610" y="118" text-anchor="middle" font-family="'Jost',sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">One matrix, 35 columns</text>
  <line x1="519" y1="128" x2="702" y2="128" stroke="#475569" stroke-width="1"/>
  <text x="610" y="148" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="9" fill="#CBD5E1">8 scaled numeric +</text>
  <text x="610" y="163" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="9" fill="#CBD5E1">27 one-hot categorical</text>
  <text x="610" y="182" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="8" font-style="italic" fill="#94A3B8">get_feature_names_out() names all 35</text>

  <!-- LEGEND -->
  <rect x="40" y="255" width="680" height="1" fill="#E2E8F0"/>
  <circle cx="150" cy="266" r="5" fill="#059669"/>
  <text x="160" y="270" font-family="'Libre Franklin',sans-serif" font-size="8.5" fill="#64748B">Numeric branch (unchanged column count)</text>
  <circle cx="420" cy="266" r="5" fill="#0369A1"/>
  <text x="430" y="270" font-family="'Libre Franklin',sans-serif" font-size="8.5" fill="#64748B">Categorical branch (expands via one-hot)</text>

  <text x="380" y="300" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="8.5" font-style="italic" fill="#94A3B8">Both branches are fit on training data only, inside the same Pipeline.fit() call</text>
</svg>
