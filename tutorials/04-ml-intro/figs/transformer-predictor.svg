<svg width="760" height="270" viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Jost:wght@400;600;700&amp;display=swap');
    </style>
    <filter id="card-shadow" x="-6%" y="-8%" width="114%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(30,41,59,0.10)"/>
    </filter>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="380" y="24" text-anchor="middle"
        font-family="'Jost','Segoe UI',system-ui,sans-serif"
        font-size="14" font-weight="700" fill="#1E293B">Two Shapes, Every Algorithm</text>
  <text x="380" y="40" text-anchor="middle"
        font-family="'Libre Franklin','Segoe UI',sans-serif"
        font-size="10.5" fill="#64748B">What fit learns determines whether the next call is transform or predict</text>
  <line x1="40" y1="47" x2="720" y2="47" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ========================================================
       ROW 1: Transformer
       ======================================================== -->
  <text x="60" y="80" font-family="'Jost',sans-serif" font-size="11" font-weight="700" fill="#065F46">Transformer</text>
  <text x="60" y="94" font-family="'Libre Franklin',sans-serif" font-size="9" fill="#64748B">e.g. StandardScaler, OneHotEncoder</text>

  <rect x="220" y="65" width="120" height="36" rx="6" fill="#EBF5F0" stroke="#059669" stroke-width="1.2" filter="url(#card-shadow)"/>
  <text x="280" y="88" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="9.5" fill="#065F46">fit(X_train)</text>

  <path d="M340,83 L390,83" fill="none" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="365" y="76" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="8" font-style="italic" fill="#64748B">learns</text>

  <rect x="392" y="65" width="140" height="36" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" filter="url(#card-shadow)"/>
  <text x="462" y="83" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="8.5" fill="#334155">mean, scale, or</text>
  <text x="462" y="95" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="8.5" fill="#334155">category list</text>

  <path d="M532,83 L582,83" fill="none" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="584" y="65" width="130" height="36" rx="6" fill="#EBF5F0" stroke="#059669" stroke-width="1.2" filter="url(#card-shadow)"/>
  <text x="649" y="88" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="9.5" fill="#065F46">transform(X)</text>

  <text x="649" y="118" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="8" font-style="italic" fill="#94A3B8">never sees a target</text>

  <!-- ========================================================
       ROW 2: Predictor
       ======================================================== -->
  <line x1="40" y1="145" x2="720" y2="145" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="60" y="176" font-family="'Jost',sans-serif" font-size="11" font-weight="700" fill="#1E3A5F">Predictor</text>
  <text x="60" y="189" font-family="'Libre Franklin',sans-serif" font-size="9" fill="#64748B">e.g. LinearRegression,</text>
  <text x="60" y="200" font-family="'Libre Franklin',sans-serif" font-size="9" fill="#64748B">LogisticRegression</text>

  <rect x="220" y="163" width="120" height="36" rx="6" fill="#EAF3FA" stroke="#0369A1" stroke-width="1.2" filter="url(#card-shadow)"/>
  <text x="280" y="182" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="9.5" fill="#1E3A5F">fit(X, y)</text>
  <text x="280" y="193" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="7.5" fill="#1E3A5F">(y is required)</text>

  <path d="M340,181 L390,181" fill="none" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="365" y="174" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="8" font-style="italic" fill="#64748B">learns</text>

  <rect x="392" y="163" width="140" height="36" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" filter="url(#card-shadow)"/>
  <text x="462" y="185" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="8.5" fill="#334155">a mapping to a</text>
  <text x="462" y="197" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="8.5" fill="#334155">known answer</text>

  <path d="M532,181 L582,181" fill="none" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="584" y="163" width="130" height="36" rx="6" fill="#EAF3FA" stroke="#0369A1" stroke-width="1.2" filter="url(#card-shadow)"/>
  <text x="649" y="186" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="9.5" fill="#1E3A5F">predict(X)</text>

  <text x="649" y="216" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="8" font-style="italic" fill="#94A3B8">a Pipeline chains several of the first into one of the second</text>

  <!-- ========================================================
       LEGEND
       ======================================================== -->
  <rect x="40" y="245" width="680" height="1" fill="#E2E8F0"/>
  <circle cx="150" cy="256" r="5" fill="#059669"/>
  <text x="160" y="260" font-family="'Libre Franklin',sans-serif" font-size="8.5" fill="#64748B">Transformer: fit + transform</text>
  <circle cx="380" cy="256" r="5" fill="#0369A1"/>
  <text x="390" y="260" font-family="'Libre Franklin',sans-serif" font-size="8.5" fill="#64748B">Predictor: fit(X, y) + predict</text>
</svg>
