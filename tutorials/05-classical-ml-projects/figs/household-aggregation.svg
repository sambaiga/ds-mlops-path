<svg width="760" height="330" viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Jost:wght@400;600;700&amp;display=swap');
    </style>
    <filter id="card-shadow" x="-6%" y="-8%" width="114%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(30,41,59,0.10)"/>
    </filter>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="380" y="24" text-anchor="middle"
        font-family="'Jost','Segoe UI',system-ui,sans-serif"
        font-size="14" font-weight="700" fill="#1E293B">Many Rows, One Household</text>
  <text x="380" y="40" text-anchor="middle"
        font-family="'Libre Franklin','Segoe UI',sans-serif"
        font-size="10.5" fill="#64748B">Every purchase and one survey response collapse into a single feature row</text>
  <line x1="40" y1="47" x2="720" y2="47" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ========================================================
       LEFT COLUMN: transaction rows (feature window, days 0-364)
       ======================================================== -->
  <text x="150" y="70" text-anchor="middle"
        font-family="'Jost',sans-serif" font-size="10.5" font-weight="700" fill="#065F46">Purchases, feature window</text>

  <rect x="40" y="80" width="220" height="30" rx="6" fill="#EBF5F0" stroke="#059669" stroke-width="1.2" filter="url(#card-shadow)"/>
  <text x="150" y="99" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="9" fill="#065F46">Day 12 &#183; ELECTRONICS &#183; $50</text>

  <rect x="40" y="118" width="220" height="30" rx="6" fill="#EBF5F0" stroke="#059669" stroke-width="1.2" filter="url(#card-shadow)"/>
  <text x="150" y="137" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="9" fill="#065F46">Day 45 &#183; missing category &#183; $30</text>

  <rect x="40" y="156" width="220" height="30" rx="6" fill="#EBF5F0" stroke="#059669" stroke-width="1.2" filter="url(#card-shadow)"/>
  <text x="150" y="175" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="9" fill="#065F46">Day 201 &#183; BOOKS &#183; $22</text>

  <text x="150" y="200" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="9" font-style="italic" fill="#94A3B8">+ 31 more purchases, 34 in total</text>

  <!-- Survey response card -->
  <text x="150" y="238" text-anchor="middle"
        font-family="'Jost',sans-serif" font-size="10.5" font-weight="700" fill="#1E3A5F">Survey response, one row</text>
  <rect x="40" y="248" width="220" height="40" rx="6" fill="#EAF3FA" stroke="#0369A1" stroke-width="1.2" filter="url(#card-shadow)"/>
  <text x="150" y="266" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="9" fill="#1E3A5F">age, income, education, state,</text>
  <text x="150" y="279" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="9" fill="#1E3A5F">household size, usage frequency</text>

  <!-- Arrows converging -->
  <path d="M262,130 L330,130 L330,165 L390,165" fill="none" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M262,268 L330,268 L330,200 L390,200" fill="none" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arr)"/>

  <text x="330" y="150" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="8.5" font-style="italic" fill="#64748B">groupby(</text>
  <text x="330" y="161" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="8.5" font-style="italic" fill="#64748B">"Survey ResponseID")</text>

  <!-- ========================================================
       RIGHT: single feature-matrix row
       ======================================================== -->
  <rect x="400" y="90" width="320" height="190" rx="8" fill="#1E293B" filter="url(#card-shadow)"/>
  <text x="560" y="115" text-anchor="middle"
        font-family="'Jost',sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">One row: a typical household</text>
  <line x1="416" y1="126" x2="704" y2="126" stroke="#475569" stroke-width="1"/>

  <text x="428" y="148" font-family="'Libre Franklin',sans-serif" font-size="9.5" fill="#CBD5E1">early_spend</text>
  <text x="704" y="148" text-anchor="end" font-family="'Libre Franklin',sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF">$797.87</text>

  <text x="428" y="169" font-family="'Libre Franklin',sans-serif" font-size="9.5" fill="#CBD5E1">n_purchases</text>
  <text x="704" y="169" text-anchor="end" font-family="'Libre Franklin',sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF">34</text>

  <text x="428" y="190" font-family="'Libre Franklin',sans-serif" font-size="9.5" fill="#CBD5E1">n_categories</text>
  <text x="704" y="190" text-anchor="end" font-family="'Libre Franklin',sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF">22</text>

  <text x="428" y="211" font-family="'Libre Franklin',sans-serif" font-size="9.5" fill="#CBD5E1">Q-demos-age ... Q-amazon-use-how-oft</text>
  <text x="704" y="211" text-anchor="end" font-family="'Libre Franklin',sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF">9 columns</text>

  <line x1="416" y1="222" x2="704" y2="222" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="428" y="244" font-family="'Libre Franklin',sans-serif" font-size="9.5" fill="#FDE68A">target_spend</text>
  <text x="704" y="244" text-anchor="end" font-family="'Libre Franklin',sans-serif" font-size="9.5" font-weight="700" fill="#FDE68A">$918.58</text>

  <text x="560" y="265" text-anchor="middle" font-family="'Libre Franklin',sans-serif" font-size="8" font-style="italic" fill="#94A3B8">target: days 365-729, never seen by the features above</text>

  <!-- ========================================================
       LEGEND
       ======================================================== -->
  <rect x="40" y="305" width="680" height="1" fill="#E2E8F0"/>
  <circle cx="150" cy="316" r="5" fill="#059669"/>
  <text x="160" y="320" font-family="'Libre Franklin',sans-serif" font-size="8.5" fill="#64748B">Feature window (days 0-364)</text>
  <circle cx="340" cy="316" r="5" fill="#0369A1"/>
  <text x="350" y="320" font-family="'Libre Franklin',sans-serif" font-size="8.5" fill="#64748B">Survey (one-time)</text>
  <circle cx="480" cy="316" r="5" fill="#1E293B"/>
  <text x="490" y="320" font-family="'Libre Franklin',sans-serif" font-size="8.5" fill="#64748B">One feature-matrix row</text>
</svg>
