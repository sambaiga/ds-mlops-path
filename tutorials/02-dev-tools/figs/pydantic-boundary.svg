<svg width="820" height="280" viewBox="0 0 820 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: 'Jost', system-ui, sans-serif; }
      .code { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M1,1 L6,3.5 L1,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M1,1 L6,3.5 L1,6 Z" fill="#EF4444"/>
    </marker>
  </defs>

  <!-- Left: External world -->
  <rect x="20" y="30" width="195" height="200" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="117" y="53" font-size="10" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1">EXTERNAL WORLD</text>

  <rect x="36" y="64" width="163" height="26" rx="4" fill="#FFF7ED" stroke="#D97706" stroke-width="1"/>
  <text x="117" y="81" font-size="11" fill="#92400E" text-anchor="middle">JSON from API</text>

  <rect x="36" y="96" width="163" height="26" rx="4" fill="#FFF7ED" stroke="#D97706" stroke-width="1"/>
  <text x="117" y="113" font-size="11" fill="#92400E" text-anchor="middle">CSV row upload</text>

  <rect x="36" y="128" width="163" height="26" rx="4" fill="#FFF7ED" stroke="#D97706" stroke-width="1"/>
  <text x="117" y="145" font-size="11" fill="#92400E" text-anchor="middle">Web form input</text>

  <text x="117" y="180" font-size="10" fill="#94A3B8" text-anchor="middle">unpredictable types,</text>
  <text x="117" y="196" font-size="10" fill="#94A3B8" text-anchor="middle">missing fields, bad values</text>

  <!-- Arrow in -->
  <line x1="215" y1="130" x2="265" y2="130" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Pydantic boundary -->
  <rect x="265" y="30" width="290" height="200" rx="8" fill="#EFF6FF" stroke="#0369A1" stroke-width="2"/>
  <text x="410" y="54" font-size="12" font-weight="700" fill="#0369A1" text-anchor="middle">PYDANTIC MODEL</text>
  <text x="410" y="71" font-size="10" fill="#0369A1" text-anchor="middle">StudentRecord</text>

  <rect x="282" y="82" width="256" height="22" rx="3" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="410" y="97" font-size="10" fill="#1E40AF" text-anchor="middle">midterm_score: float (0 to 100)</text>

  <rect x="282" y="110" width="256" height="22" rx="3" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="410" y="125" font-size="10" fill="#1E40AF" text-anchor="middle">student_id: str matching S\d{4}</text>

  <rect x="282" y="138" width="256" height="22" rx="3" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="410" y="153" font-size="10" fill="#1E40AF" text-anchor="middle">program: str, not empty</text>

  <!-- Error path (downward) -->
  <line x1="410" y1="230" x2="410" y2="252" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="282" y="252" width="256" height="20" rx="3" fill="#FEE2E2" stroke="#EF4444" stroke-width="1"/>
  <text x="410" y="266" font-size="10" fill="#991B1B" text-anchor="middle">ValidationError: field, reason, value</text>

  <!-- Arrow out (clean) -->
  <line x1="555" y1="130" x2="600" y2="130" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Right: Your code -->
  <rect x="600" y="30" width="200" height="200" rx="8" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="700" y="53" font-size="10" font-weight="700" fill="#065F46" text-anchor="middle" letter-spacing="1">YOUR CODE</text>

  <rect x="618" y="64" width="164" height="26" rx="4" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
  <text x="700" y="81" font-size="11" fill="#065F46" text-anchor="middle">typed Python objects</text>

  <rect x="618" y="96" width="164" height="26" rx="4" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
  <text x="700" y="113" font-size="11" fill="#065F46" text-anchor="middle">validated constraints</text>

  <rect x="618" y="128" width="164" height="26" rx="4" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
  <text x="700" y="145" font-size="11" fill="#065F46" text-anchor="middle">no surprises downstream</text>

  <text x="700" y="180" font-size="10" fill="#059669" text-anchor="middle">predictable,</text>
  <text x="700" y="196" font-size="10" fill="#059669" text-anchor="middle">structured data only</text>

  <!-- Caption -->
  <text x="410" y="278" font-size="12" fill="#64748B" text-anchor="middle">Pydantic is the boundary between the unpredictable outside world and your structured code.</text>
</svg>
