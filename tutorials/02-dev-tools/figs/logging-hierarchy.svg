<svg width="820" height="330" viewBox="0 0 820 330" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: 'Jost', system-ui, sans-serif; }
      .code { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M1,1 L6,3.5 L1,6 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- LEFT: Logger hierarchy (x=20..395) -->
  <text x="205" y="20" font-size="10" font-weight="700" fill="#64748B"
        text-anchor="middle" letter-spacing="1">LOGGER HIERARCHY</text>

  <!-- root logger -->
  <rect x="40" y="30" width="330" height="34" rx="6" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="205" y="47" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">root logger</text>
  <text x="205" y="60" font-size="10" fill="#94A3B8" text-anchor="middle">(propagation stops here)</text>

  <line x1="205" y1="64" x2="205" y2="82" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- module logger -->
  <rect x="60" y="82" width="290" height="30" rx="6" fill="#EFF6FF" stroke="#0369A1" stroke-width="1.5"/>
  <text x="205" y="102" class="code" font-size="11" fill="#0C4A6E" text-anchor="middle">grade_predictor</text>

  <!-- branches -->
  <line x1="130" y1="112" x2="100" y2="128" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="280" y1="112" x2="310" y2="128" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- sub-loggers -->
  <rect x="40" y="128" width="175" height="26" rx="5" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="127" y="145" class="code" font-size="10" fill="#1E40AF" text-anchor="middle">grade_predictor.core</text>

  <rect x="220" y="128" width="190" height="26" rx="5" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
  <text x="315" y="145" class="code" font-size="10" fill="#1E40AF" text-anchor="middle">grade_predictor.pipeline</text>

  <!-- Log levels section -->
  <text x="205" y="180" font-size="10" font-weight="700" fill="#64748B"
        text-anchor="middle" letter-spacing="1">LOG LEVELS</text>

  <rect x="22"  y="190" width="60"  height="26" rx="4" fill="#F0F9FF" stroke="#7DD3FC" stroke-width="1"/>
  <text x="52"  y="208" font-size="11" font-weight="600" fill="#0369A1" text-anchor="middle">DEBUG</text>

  <rect x="87"  y="190" width="52"  height="26" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="113" y="208" font-size="11" font-weight="600" fill="#059669" text-anchor="middle">INFO</text>

  <rect x="144" y="190" width="74"  height="26" rx="4" fill="#FFF7ED" stroke="#FCD34D" stroke-width="1"/>
  <text x="181" y="208" font-size="11" font-weight="600" fill="#D97706" text-anchor="middle">WARNING</text>

  <rect x="223" y="190" width="62"  height="26" rx="4" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="254" y="208" font-size="11" font-weight="600" fill="#DC2626" text-anchor="middle">ERROR</text>

  <rect x="290" y="190" width="90"  height="26" rx="4" fill="#4C1D95" stroke="#7C3AED" stroke-width="1"/>
  <text x="335" y="208" font-size="11" font-weight="600" fill="#F5F3FF" text-anchor="middle">CRITICAL</text>

  <!-- Arrow under levels -->
  <line x1="22" y1="228" x2="375" y2="228" stroke="#CBD5E1" stroke-width="1.2"
        marker-end="url(#arr)"/>
  <text x="198" y="244" font-size="10" fill="#94A3B8" text-anchor="middle">increasing severity; setLevel() filters all below</text>

  <!-- Divider -->
  <line x1="410" y1="20" x2="410" y2="310" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- RIGHT: Handlers (x=425..800) -->
  <text x="615" y="20" font-size="10" font-weight="700" fill="#64748B"
        text-anchor="middle" letter-spacing="1">HANDLERS (where output goes)</text>

  <rect x="430" y="30" width="360" height="46" rx="6" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="610" y="50" font-size="11" font-weight="600" fill="#065F46" text-anchor="middle">StreamHandler</text>
  <text x="610" y="68" font-size="10" fill="#065F46" text-anchor="middle">console output (development)</text>

  <rect x="430" y="92" width="360" height="46" rx="6" fill="#EFF6FF" stroke="#0369A1" stroke-width="1.5"/>
  <text x="610" y="112" font-size="11" font-weight="600" fill="#0C4A6E" text-anchor="middle">FileHandler</text>
  <text x="610" y="130" font-size="10" fill="#0C4A6E" text-anchor="middle">pipeline.log (production audit trail)</text>

  <rect x="430" y="154" width="360" height="46" rx="6" fill="#FDF4FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="610" y="174" font-size="11" font-weight="600" fill="#5B21B6" text-anchor="middle">RotatingFileHandler</text>
  <text x="610" y="192" font-size="10" fill="#5B21B6" text-anchor="middle">rotates when file reaches size limit</text>

  <!-- vs print -->
  <rect x="430" y="218" width="360" height="62" rx="6" fill="#FEF2F2" stroke="#FCA5A5"
        stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="610" y="240" font-size="11" font-weight="600" fill="#991B1B" text-anchor="middle">print() -- not logging</text>
  <text x="610" y="258" font-size="10" fill="#DC2626" text-anchor="middle">no timestamp, no level, no module name</text>
  <text x="610" y="274" font-size="10" fill="#DC2626" text-anchor="middle">scrolls away, cannot be redirected selectively</text>

  <!-- Caption -->
  <text x="410" y="322" font-size="12" fill="#64748B" text-anchor="middle">Python logging: structured, filterable, persistent records that print() cannot provide.</text>
</svg>
