<svg width="820" height="300" viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: 'Jost', system-ui, sans-serif; }
      .code { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M1,1 L6,3.5 L1,6 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M1,1 L6,3.5 L1,6 Z" fill="#EF4444"/>
    </marker>
  </defs>

  <!-- Left: Raw DataFrame -->
  <rect x="20" y="30" width="200" height="215" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="120" y="53" font-size="10" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1">RAW DATAFRAME</text>
  <text x="120" y="70" font-size="10" fill="#94A3B8" text-anchor="middle">2,400 rows</text>

  <!-- Mini table -->
  <rect x="30" y="80" width="180" height="16" rx="2" fill="#E2E8F0"/>
  <text x="120" y="92" class="code" font-size="9" fill="#475569" text-anchor="middle">student_id | score | program</text>

  <rect x="30" y="100" width="180" height="13" rx="2" fill="#DCFCE7"/>
  <text x="120" y="111" class="code" font-size="9" fill="#065F46" text-anchor="middle">S0042 | 87.5 | CS</text>

  <rect x="30" y="116" width="180" height="13" rx="2" fill="#FEE2E2"/>
  <text x="120" y="127" class="code" font-size="9" fill="#991B1B" text-anchor="middle">None | 102 | ""</text>

  <rect x="30" y="132" width="180" height="13" rx="2" fill="#FFF7ED"/>
  <text x="120" y="143" class="code" font-size="9" fill="#92400E" text-anchor="middle">S1201 | "N/A" | Engineering</text>

  <rect x="30" y="148" width="180" height="13" rx="2" fill="#DCFCE7"/>
  <text x="120" y="159" class="code" font-size="9" fill="#065F46" text-anchor="middle">S0099 | 74.0 | Math</text>

  <text x="120" y="185" font-size="10" fill="#94A3B8" text-anchor="middle">mixed types in columns,</text>
  <text x="120" y="200" font-size="10" fill="#94A3B8" text-anchor="middle">values out of range,</text>
  <text x="120" y="215" font-size="10" fill="#94A3B8" text-anchor="middle">empty strings not NaN</text>

  <!-- Arrow in -->
  <line x1="220" y1="132" x2="265" y2="132" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Pandera schema -->
  <rect x="265" y="30" width="290" height="215" rx="8" fill="#FDF4FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="410" y="53" font-size="12" font-weight="700" fill="#7C3AED" text-anchor="middle">PANDERA SCHEMA</text>
  <text x="410" y="70" font-size="10" fill="#7C3AED" text-anchor="middle">StudentDataSchema</text>

  <rect x="282" y="80" width="256" height="20" rx="3" fill="#F3E8FF" stroke="#C4B5FD" stroke-width="1"/>
  <text x="410" y="94" font-size="10" fill="#5B21B6" text-anchor="middle">student_id: str, regex S\d{4}, not null</text>

  <rect x="282" y="106" width="256" height="20" rx="3" fill="#F3E8FF" stroke="#C4B5FD" stroke-width="1"/>
  <text x="410" y="120" font-size="10" fill="#5B21B6" text-anchor="middle">final_score: float, 0 to 100 inclusive</text>

  <rect x="282" y="132" width="256" height="20" rx="3" fill="#F3E8FF" stroke="#C4B5FD" stroke-width="1"/>
  <text x="410" y="146" font-size="10" fill="#5B21B6" text-anchor="middle">program: str, not empty string</text>

  <rect x="282" y="158" width="256" height="20" rx="3" fill="#F3E8FF" stroke="#C4B5FD" stroke-width="1"/>
  <text x="410" y="172" font-size="10" fill="#5B21B6" text-anchor="middle">enrollment_date: datetime, not null</text>

  <!-- Error path -->
  <line x1="410" y1="245" x2="410" y2="268" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="282" y="268" width="256" height="20" rx="3" fill="#FEE2E2" stroke="#EF4444" stroke-width="1"/>
  <text x="410" y="282" font-size="10" fill="#991B1B" text-anchor="middle">SchemaError: column, row, violation</text>

  <!-- Arrow out -->
  <line x1="555" y1="132" x2="600" y2="132" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Right: Validated frame -->
  <rect x="600" y="30" width="200" height="215" rx="8" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="700" y="53" font-size="10" font-weight="700" fill="#065F46" text-anchor="middle" letter-spacing="1">VALIDATED FRAME</text>
  <text x="700" y="70" font-size="10" fill="#059669" text-anchor="middle">schema-conforming rows only</text>

  <rect x="612" y="80" width="176" height="16" rx="2" fill="#E2E8F0"/>
  <text x="700" y="92" class="code" font-size="9" fill="#475569" text-anchor="middle">student_id | score | program</text>

  <rect x="612" y="100" width="176" height="13" rx="2" fill="#DCFCE7"/>
  <text x="700" y="111" class="code" font-size="9" fill="#065F46" text-anchor="middle">S0042 | 87.5 | CS</text>

  <rect x="612" y="116" width="176" height="13" rx="2" fill="#DCFCE7"/>
  <text x="700" y="127" class="code" font-size="9" fill="#065F46" text-anchor="middle">S0099 | 74.0 | Math</text>

  <text x="700" y="160" font-size="10" fill="#059669" text-anchor="middle">correct column types,</text>
  <text x="700" y="175" font-size="10" fill="#059669" text-anchor="middle">values within bounds,</text>
  <text x="700" y="190" font-size="10" fill="#059669" text-anchor="middle">no surprise NaNs</text>

  <!-- Caption -->
  <text x="410" y="298" font-size="12" fill="#64748B" text-anchor="middle">A Pandera schema is a contract: it states what the DataFrame must look like before any analysis runs.</text>
</svg>
