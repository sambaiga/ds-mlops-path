<svg width="820" height="300" viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: 'Jost', system-ui, sans-serif; }
      .code { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M1,1 L6,3.5 L1,6 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Column headers -->
  <text x="200" y="22" font-size="11" font-weight="700" fill="#991B1B"
        text-anchor="middle" letter-spacing="1">WITHOUT ANNOTATIONS</text>
  <text x="610" y="22" font-size="11" font-weight="700" fill="#065F46"
        text-anchor="middle" letter-spacing="1">WITH ANNOTATIONS</text>

  <!-- Divider -->
  <line x1="410" y1="30" x2="410" y2="292" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- LEFT: code call -->
  <rect x="30" y="36" width="360" height="36" rx="6" fill="#1E293B"/>
  <text x="210" y="59" class="code" font-size="12" fill="#F1F5F9" text-anchor="middle">compute_grade("incomplete", 85, 90)</text>

  <line x1="210" y1="72" x2="210" y2="90" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- No warning -->
  <rect x="75" y="90" width="270" height="30" rx="6" fill="#FFF7ED" stroke="#D97706" stroke-width="1.5"/>
  <text x="210" y="110" font-size="12" fill="#92400E" text-anchor="middle">Python accepts it. No warning.</text>

  <line x1="210" y1="120" x2="210" y2="138" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Runtime error -->
  <rect x="30" y="138" width="360" height="50" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="210" y="160" class="code" font-size="10" fill="#991B1B" text-anchor="middle">TypeError: can't multiply sequence</text>
  <text x="210" y="176" class="code" font-size="10" fill="#991B1B" text-anchor="middle">by non-int of type 'float'</text>

  <text x="210" y="216" font-size="12" font-weight="600" fill="#DC2626" text-anchor="middle">Error at RUNTIME</text>
  <text x="210" y="236" font-size="11" fill="#7F1D1D" text-anchor="middle">possibly hours after the wrong call,</text>
  <text x="210" y="254" font-size="11" fill="#7F1D1D" text-anchor="middle">deep inside a pipeline with no trace</text>

  <!-- RIGHT: code call -->
  <rect x="430" y="36" width="360" height="36" rx="6" fill="#1E293B"/>
  <text x="610" y="59" class="code" font-size="12" fill="#F1F5F9" text-anchor="middle">compute_grade("incomplete", 85, 90)</text>

  <line x1="610" y1="72" x2="610" y2="90" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- IDE warning -->
  <rect x="430" y="90" width="360" height="50" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="610" y="112" font-size="11" fill="#065F46" text-anchor="middle">Argument of type 'str' cannot be assigned</text>
  <text x="610" y="129" font-size="11" fill="#065F46" text-anchor="middle">to parameter 'midterm: float'</text>

  <text x="610" y="186" font-size="12" font-weight="600" fill="#059669" text-anchor="middle">Error at EDIT TIME</text>
  <text x="610" y="206" font-size="11" fill="#065F46" text-anchor="middle">red underline the moment you type it,</text>
  <text x="610" y="224" font-size="11" fill="#065F46" text-anchor="middle">before you run a single line</text>

  <!-- Caption -->
  <text x="410" y="284" font-size="12" fill="#64748B" text-anchor="middle">
    Type annotations move error detection from runtime to edit time.
  </text>
</svg>
